name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: novita-controller-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Set up Python 3.12
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install 3.12
          uv venv --seed --python 3.12 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: bash scripts/test-hosted.sh
      - run: go test ./...
      - run: PYTHONPATH=provisioner/novita python -m pytest -q provisioner/novita/test_adapter.py
